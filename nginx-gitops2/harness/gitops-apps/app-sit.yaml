application:
  name: nginx-ingress-sit
  identifier: nginx_ingress_sit
  orgIdentifier: default
  projectIdentifier: nginx_gitops
  agentIdentifier: gitops_agent_sit
  clusterIdentifier: eks_sit
  repoIdentifier: nginx_gitops_repo
  description: ingress-nginx for SIT via Kustomize overlay
  tags:
    env: sit
    ingress: nginx

  spec:
    source:
      repoURL: https://github.com/your-org/nginx-gitops   # update
      targetRevision: HEAD
      path: kustomize/overlays/sit

    destination:
      server: https://kubernetes.default.svc
      namespace: ingress-nginx

    syncPolicy:
      automated:
        prune: true
        selfHeal: true
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
      retry:
        limit: 3
        backoff:
          duration: 5s
          factor: 2
          maxDuration: 1m

    ignoreDifferences:
      - group: apps
        kind: Deployment
        jsonPointers:
          - /spec/replicas
