gitOpsCluster:
  name: eks-prod
  identifier: eks_prod
  orgIdentifier: default
  projectIdentifier: nginx_gitops
  envRef: prod
  agentIdentifier: gitops_agent_prod
  tags:
    env: prod
    managed-by: harness-gitops
  request:
    upsert: true
    cluster:
      name: eks-prod
      server: https://kubernetes.default.svc
      config:
        clusterConnectionType: IN_CLUSTER
