# Base default values for ingress-nginx wrapper chart.
# All environment-specific config lives in kustomize/overlays/<env>/
# This file intentionally minimal — Kustomize patches override everything.

ingress-nginx:
  controller:
    replicaCount: 1
    image:
      registry: registry.k8s.io
      image: ingress-nginx/controller
      tag: "v1.10.1"
      pullPolicy: IfNotPresent

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

    service:
      type: LoadBalancer
      annotations: {}
      externalTrafficPolicy: Local

    metrics:
      enabled: true
      serviceMonitor:
        enabled: false

    config:
      use-forwarded-headers: "true"
      compute-full-forwarded-for: "true"

    autoscaling:
      enabled: false

  defaultBackend:
    enabled: true
