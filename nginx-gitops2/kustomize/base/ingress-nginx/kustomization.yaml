# kustomize/base/ingress-nginx/kustomization.yaml
# Base layer: defines the Helm chart source and shared manifests.
# Overlays patch this with environment-specific values.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ingress-nginx

resources:
  - namespace.yaml
  - helmrelease.yaml

commonLabels:
  app.kubernetes.io/managed-by: harness-gitops
  app.kubernetes.io/component: ingress-controller
  ingress-type: nginx
