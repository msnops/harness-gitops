apiVersion: v1
kind: ConfigMap
metadata:
  name: ingress-nginx-argocd-values
  namespace: ingress-nginx
  annotations:
    argocd.argoproj.io/helm-values: "true"
data:
  values.yaml: |
    ingress-nginx:
      controller:
        replicaCount: 2
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        service:
          type: LoadBalancer
          externalTrafficPolicy: Local
          annotations:
            service.beta.kubernetes.io/aws-load-balancer-scheme: internal
            service.beta.kubernetes.io/aws-load-balancer-type: nlb
        metrics:
          enabled: true
          serviceMonitor:
            enabled: true
            namespace: monitoring
        autoscaling:
          enabled: false
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchExpressions:
                      - key: app.kubernetes.io/name
                        operator: In
                        values:
                          - ingress-nginx
                  topologyKey: kubernetes.io/hostname
      defaultBackend:
        enabled: true
