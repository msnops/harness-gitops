apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-argocd-values
  namespace: traefik
  annotations:
    argocd.argoproj.io/helm-values: "true"
data:
  values.yaml: |
    traefik:
      replicaCount: 3

      deployment:
        replicas: 3

      resources:
        requests:
          cpu: 500m
          memory: 512Mi
        limits:
          cpu: 2000m
          memory: 2Gi

      service:
        type: LoadBalancer
        externalTrafficPolicy: Local
        annotations:
          service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
          service.beta.kubernetes.io/aws-load-balancer-type: nlb
          service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"

      ports:
        web:
          port: 8000
          expose:
            default: true
          exposedPort: 80
        websecure:
          port: 8443
          expose:
            default: true
          exposedPort: 443
          tls:
            enabled: true
        traefik:
          port: 9000
          expose:
            default: true   # expose dashboard port internally

      ingressRoute:
        dashboard:
          enabled: true
          annotations:
            kubernetes.io/ingress.class: traefik

      providers:
        kubernetesCRD:
          enabled: true
          allowCrossNamespace: true
        kubernetesIngress:
          enabled: true
          publishedService:
            enabled: true

      logs:
        general:
          level: WARN
        access:
          enabled: true

      metrics:
        prometheus:
          enabled: true
          serviceMonitor:
            enabled: true
            namespace: monitoring

      # Hard anti-affinity — no two Traefik pods on the same node
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - traefik
              topologyKey: kubernetes.io/hostname

      autoscaling:
        enabled: true
        minReplicas: 3
        maxReplicas: 8
        metrics:
          - type: Resource
            resource:
              name: cpu
              target:
                type: Utilization
                averageUtilization: 70

      podDisruptionBudget:
        enabled: true
        minAvailable: 2
